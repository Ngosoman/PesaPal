services:
  - type: web
    name: pesapal-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Set ALLOWED_HOSTS to your Render service hostname, e.g. pesapal-backend.onrender.com
      - key: ALLOWED_HOSTS
        sync: false
      # Set to your Vercel frontend URL, e.g. https://pesapal.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # PesaPal live credentials — copy from your local .env
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_ENVIRONMENT
        value: production
      - key: PESAPAL_AUTH_URL
        value: https://pay.pesapal.com/v3/api/Auth/RequestToken
      - key: PESAPAL_SUBMIT_ORDER_URL
        value: https://pay.pesapal.com/v3/api/Transactions/SubmitOrderRequest
      - key: PESAPAL_TRANSACTION_STATUS_URL
        value: https://pay.pesapal.com/v3/api/Transactions/GetTransactionStatus
      - key: PESAPAL_REGISTER_IPN_URL
        value: https://pay.pesapal.com/v3/api/URLSetup/RegisterIPN
      # Set to https://<your-render-url>/api/pesapal/callback/
      - key: PESAPAL_CALLBACK_URL
        sync: false
      # Set to https://<your-render-url>/api/pesapal/ipn/
      - key: PESAPAL_IPN_NOTIFICATION_URL
        sync: false
      - key: PESAPAL_IPN_ID
        value: ""
